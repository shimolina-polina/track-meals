
name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
            node <<'NODE'
            const fs = require('fs');
            
            const path = 'app.json';
            const config = JSON.parse(fs.readFileSync(path, 'utf8'));
            
            config.expo.android ??= {};
            config.expo.android.versionCode =
              Number(process.env.ANDROID_VERSION_CODE) + 2;
            
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
            NODE
            
            npx expo prebuild --platform android

      - name: Set Android versionCode
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let gradle = fs.readFileSync(path, 'utf8');
          const versionCode = Number(process.env.GITHUB_RUN_NUMBER);

          if (!Number.isSafeInteger(versionCode) || versionCode < 1) {
            throw new Error('Invalid versionCode');
          }

          const pattern = /(\bversionCode\s+)\d+/;

          if (!pattern.test(gradle)) {
            throw new Error('versionCode not found in build.gradle');
          }

          gradle = gradle.replace(
            pattern,
            (_, prefix) => `${prefix}${versionCode}`
          );

          fs.writeFileSync(path, gradle);
          console.log(`Android versionCode: ${versionCode}`);
          NODE
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Missing ANDROID_KEYSTORE_BASE64"
            exit 1
          }
        
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore
        
          cat >> android/gradle.properties <<EOF
        
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
          EOF
        
          python3 <<'PY'
          from pathlib import Path
          import re
        
          path = Path("android/app/build.gradle")
          text = path.read_text()
          
          if "signingConfigs {" not in text:
              raise SystemExit("signingConfigs block not found")
        
          if "signingConfigs.release" in text:
              raise SystemExit(
                  "Release signing appears configured already; inspect build.gradle"
              )
        
          signing_config = """
                  release {
                      if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                          storeFile file(MYAPP_UPLOAD_STORE_FILE)
                          storePassword MYAPP_UPLOAD_STORE_PASSWORD
                          keyAlias MYAPP_UPLOAD_KEY_ALIAS
                          keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                      }
                  }
          """
        
          text = re.sub(
              r"(signingConfigs\\s*\\{)",
              r"\\1" + signing_config,
              text,
              count=1
          )
        
          match = re.search(r"buildTypes\\s*\\{", text)
          if not match:
              raise SystemExit("buildTypes block not found")
        
          start = match.end()
          depth = 1
          i = start
          while i < len(text) and depth:
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
              i += 1
        
          block = text[start:i - 1]
          release_match = re.search(r"\\brelease\\s*\\{", block)
          if not release_match:
              raise SystemExit("release buildType not found")
        
          rstart = release_match.end()
          depth = 1
          j = rstart
          while j < len(block) and depth:
              if block[j] == "{":
                  depth += 1
              elif block[j] == "}":
                  depth -= 1
              j += 1
        
          release_block = block[rstart:j - 1]
          release_block = re.sub(
              r"signingConfig\\s+signingConfigs\\.debug",
              "signingConfig signingConfigs.release",
              release_block
          )
        
          if "signingConfig signingConfigs.release" not in release_block:
              release_block = (
                  "\\n                    signingConfig signingConfigs.release"
                  + release_block
              )
        
          block = (
              block[:rstart]
              + release_block
              + block[j - 1:]
          )
          text = text[:start] + block + text[i - 1:]
        
          path.write_text(text)
          print("Release signing configured")
          PY
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          apksigner verify --verbose \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk \
            "release/app-${{ steps.version.outputs.tag }}.apk"

      - name: Create and push Git tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "Tag $TAG already exists"
            exit 1
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Android ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: release/*.apk
