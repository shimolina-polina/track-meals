name: Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: npm ci

      - name: Bump versionCode
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/ci-set-version-code.mjs

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

          cat >> android/gradle.properties << EOF

MYAPP_UPLOAD_STORE_FILE=release.keystore
MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD
MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS
MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD
EOF

          python3 scripts/ci-configure-signing.py

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Get version
        id: meta
        run: |
          VER=$(node -p "require('./app.json').expo.version")
          TAG="v${VER}-r${{ github.run_number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "apk=track-meals-${TAG}.apk" >> $GITHUB_OUTPUT

      - name: Prepare release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/${{ steps.meta.outputs.apk }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Track Meals ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          files: release/${{ steps.meta.outputs.apk }}
          generate_release_notes: true
